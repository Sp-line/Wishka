<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Verification</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f9f9f9; padding: 20px;">
<div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.05);">
    <h2 style="color: #333; text-align: center;">Welcome to Wishka! 🎉</h2>
    <p style="font-size: 16px; color: #555; text-align: center;">Thank you for signing up. Please verify your email
        address to get full access to all features.</p>

    <div style="text-align: center; margin: 30px 0;">
        <a href="{{ link }}"
           style="background-color: #4CAF50; color: white; padding: 14px 28px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 16px; display: inline-block;">
            Verify Email
        </a>
    </div>

    <p style="font-size: 12px; color: #999; text-align: center;">If the button doesn't work, copy and paste this link
        into your browser:<br><a href="{{ link }}" style="color: #4CAF50;">{{ link }}</a></p>
</div>
</body>
</html>
