<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f9f9f9; padding: 20px;">
<div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.05);">
    <h2 style="color: #333; text-align: center;">Password Reset 🔒</h2>
    <p style="font-size: 16px; color: #555; text-align: center;">We received a request to reset the password for your
        account. Click the button below to create a new password:</p>

    <div style="text-align: center; margin: 30px 0;">
        <a href="{{ link }}"
           style="background-color: #2196F3; color: white; padding: 14px 28px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 16px; display: inline-block;">
            Reset Password
        </a>
    </div>

    <p style="font-size: 14px; color: #777; text-align: center;">If you didn't make this request, simply ignore this
        email. Your password will remain unchanged.</p>
</div>
</body>
</html>
