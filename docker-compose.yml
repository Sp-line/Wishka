services:
  pg:
    image: postgres:18
    container_name: wishka_db
    env_file:
      - app/.env
    ports:
      - "5432:5432"
    volumes:
      - pg_data_storage:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 3

  nats:
    image: nats:2.14-alpine
    container_name: wishka_nats
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
    command: [ "-js", "-m", "8222", "--store_dir", "/data" ]
    volumes:
      - nats_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  pg_data_storage:
  nats_data:
