services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - app/.env
    ports:
      - "8000:8000"
    depends_on:
      pg:
        condition: service_healthy
      nats:
        condition: service_healthy
    command: [ "uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
        - action: rebuild
          path: ./uv.lock
        - action: rebuild
          path: ./pyproject.toml

  pg:
    image: postgres:18
    container_name: wishka_db
    env_file:
      - app/.env
    ports:
      - "5432:5432"
    volumes:
      - pg_data_storage:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 3

  nats:
    image: nats:2.14-alpine
    container_name: wishka_nats
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
    command: [ "-js", "-m", "8222", "--store_dir", "/data" ]
    volumes:
      - nats_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  pg_data_storage:
  nats_data:
